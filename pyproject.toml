[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-bot"
version = "0.1.0"
description = "A simple and modern framework for building Telegram bots"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["telegram", "bot", "framework", "async"]

dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/your-username/titan-bot"
Issues = "https://github.com/your-username/titan-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]
